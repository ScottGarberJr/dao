contract:
  name: outlook-n8n-intake
  version: "1.0"
  owner_team: unassigned
  purpose: Placeholder contract for a future approved Outlook-to-n8n intake flow.
intake_event:
  required: [contract_version, event_id, occurred_at, source, message]
  properties:
    contract_version: { type: string, const: "1.0" }
    event_id: { type: string, description: Stable Outlook event/message identifier used for idempotency. }
    occurred_at: { type: string, format: date-time }
    source: { type: string, const: outlook }
    message:
      type: object
      required: [message_id, received_at, sender_domain, subject]
      properties:
        message_id: { type: string }
        received_at: { type: string, format: date-time }
        sender_domain: { type: string }
        subject: { type: string, maxLength: 240 }
        categories: { type: array, items: { type: string } }
        importance: { type: string, enum: [low, normal, high] }
  prohibited_data: [message_body, attachment_content, recipient_addresses, credentials]
routing_result:
  required: [event_id, workflow_run_id, status, queue, requires_human_review]
  properties:
    event_id: { type: string }
    workflow_run_id: { type: string }
    status: { type: string, enum: [routed, ignored, exception] }
    queue: { type: string, description: Destination defined by the owning team's approved specification. }
    requires_human_review: { type: boolean }
    reason_code: { type: string }
    downstream_reference: { type: string }
operational_rules:
  - Deduplicate on event_id before creating downstream work.
  - Surface validation failures and retry exhaustion for handling defined by the owning team.
  - Do not enable routing until an owning team has defined scope and permissions.
  - Do not send external messages or make governance decisions automatically.
  - Retain workflow diagnostics according to the configured service policy.
